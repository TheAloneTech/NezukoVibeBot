<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NezukoMusic - Premium Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
min-height:100vh;
background: radial-gradient(circle at 30% 20%, #7c4dff 0%, #4a2b82 40%, #1e103d 100%);
color:white;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

/* Glass Card */
.container{
width:100%;
max-width:480px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(25px);
border-radius:40px;
padding:30px 25px;
box-shadow:0 20px 60px rgba(0,0,0,0.4);
}

/* Badge */
.badge{
font-size:12px;
letter-spacing:2px;
padding:8px 18px;
border-radius:30px;
background:rgba(255,255,255,0.15);
display:inline-block;
margin-bottom:20px;
}

/* Heading */
h1{
font-size:36px;
font-weight:800;
margin-bottom:15px;
}

.highlight{
background:linear-gradient(90deg,#d8b4ff,#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.description{
opacity:0.85;
line-height:1.6;
margin-bottom:30px;
}

/* Buttons */
.btn-primary{
background:white;
color:#1e103d;
padding:16px;
border-radius:50px;
text-align:center;
font-weight:600;
font-size:16px;
margin-bottom:15px;
cursor:pointer;
transition:0.3s;
}

.btn-primary:hover{
transform:scale(1.03);
}

.btn-secondary{
background:rgba(255,255,255,0.1);
padding:14px;
border-radius:50px;
text-align:center;
font-weight:500;
cursor:pointer;
}

/* Stats Cards */
.stat{
margin-top:20px;
background:rgba(255,255,255,0.08);
border-radius:25px;
padding:25px;
text-align:center;
}

.stat h2{
font-size:28px;
margin-bottom:5px;
}

.stat p{
opacity:0.8;
font-size:14px;
}

@media(max-width:400px){
h1{font-size:28px;}
}

</style>
</head>

<body>

<div class="container">

<div class="badge">ULTIMATE MUSIC EXPERIENCE</div>

<h1>
Elevate Your <span class="highlight">Music Journey</span>
</h1>

<p class="description">
NezukoMusic delivers premium voice streaming directly inside Telegram groups.
Crystal clear quality. Smooth playback. Powerful admin controls.
</p>

<div class="btn-primary" onclick="window.location.href='https://t.me/NezukoMusicBot'">
Download Now →
</div>

<div class="btn-secondary">
Explore Features
</div>

<div class="stat">
<h2>17.2k+</h2>
<p>Users</p>
</div>

<div class="stat">
<h2>5 ★</h2>
<p>App Rating</p>
</div>

<div class="stat">
<h2>900M - 1B+</h2>
<p>Songs</p>
</div>

</div>

</body>
</html>
